name: build

# The old source mirror is preservation only: this job exists to notice when it
# stops compiling, not to produce anything that ships. The maintained code is on
# master and the recovered data it was rebuilt from is on decompile.

on:
  push:
    branches: [old_source]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build (Win32 Release, as the solution defines it)
        run: msbuild ZolikaPatch.sln /p:Configuration=Release /p:Platform=x86 /m
        # No continue-on-error: if this branch stops compiling, the job is meant to
        # say so in red rather than succeed while producing nothing.

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ZolikaPatch-old-source
          path: |
            **/ZolikaPatch.asi
            **/Release/*.asi
          if-no-files-found: error
