name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x86:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (Win32)
        run: cmake -S . -B build -A Win32 -DZP_BUILD_ASI=ON -DZP_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Native tests
        run: build\Release\zp_tests.exe

      # The release artefact is the mod as it is installed: the ASI and its INI.
      # Nothing else goes in the zip (no .map, no intermediate files).
      - name: Package (ASI + INI)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\ZolikaPatch.asi dist\
          Copy-Item ZolikaPatch.ini dist\

      - name: Upload ASI
        uses: actions/upload-artifact@v4
        with:
          name: ZolikaPatch-7.65-win32
          if-no-files-found: error
          path: dist/*
